<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fired Arts Logo font specimen</title>
  <style>
    @font-face {
      font-family: "Fired Arts Logo";
      src: url("./FiredArtsLogo-Regular.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    :root { color-scheme: dark; }
    body { margin: 0; padding: 3rem; background: #171717; color: #f3eee7; font-family: system-ui, sans-serif; }
    main { max-width: 72rem; margin: auto; }
    h1 { font-family: "Fired Arts Logo", cursive; font-size: clamp(4rem, 11vw, 9rem); font-weight: 400; line-height: .9; margin: 0 0 2rem; color: #ffbf43; }
    .sample { font-family: "Fired Arts Logo", cursive; font-size: clamp(2rem, 5vw, 4rem); line-height: 1.2; overflow-wrap: anywhere; font-variant-ligatures: common-ligatures; }
    .label { margin-top: 2rem; color: #bcb3aa; font-size: .8rem; letter-spacing: .12em; text-transform: uppercase; }
  </style>
</head>
<body>
  <main>
    <h1>Fired Arts</h1>
    <div class="label">Uppercase and lowercase</div>
    <div class="sample">ABCDEFGHIJKLMNOPQRSTUVWXYZ<br>abcdefghijklmnopqrstuvwxyz</div>
    <div class="label">Brand phrases</div>
    <div class="sample">Make something beautiful<br>Fired Arts Studio</div>
  </main>
</body>
</html>
